<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Jarvis GPT</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="dark-mode">
    <div class="theme-toggle">
        <input type="checkbox" id="themeSwitcher">
        <label for="themeSwitcher">🌞🌜</label>
    </div>

    <div class="chat-container">
        <h1><i class="fas fa-brain"></i> Jarvis GPT</h1>
        <div id="chatbox" class="chat-box">
            {% if user_input %}
                <div class="chat user"><strong>You:</strong> {{ user_input }}</div>
                <div class="chat jarvis"><strong>Jarvis:</strong> <span id="responseText">{{ jarvis_response }}</span></div>
            {% endif %}
        </div>

       <form method="POST" action="/" class="chat-form">
    <input type="text" name="user_input" id="user_input" placeholder="Ask Jarvis..." required>
    <button type="submit">Send</button>
    <button type="button" id="voiceBtn">🎤</button>
</form>

    </div>

    <script>
    
        const voiceBtn = document.getElementById('voiceBtn');
        const input = document.getElementById('user_input');
        voiceBtn.addEventListener('click', () => {
            const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
            recognition.lang = 'en-IN';
            recognition.start();
            recognition.onresult = function (event) {
                const transcript = event.results[0][0].transcript;
                input.value = transcript;
            };
        });

        
        const text = document.getElementById("responseText");
        if (text) {
            const content = text.textContent;
            text.textContent = "";
            let i = 0;
            const interval = setInterval(() => {
                if (i < content.length) {
                    text.textContent += content[i];
                    i++;
                } else {
                    clearInterval(interval);
                }
            }, 30);
        }

        
        const toggle = document.getElementById('themeSwitcher');
        const body = document.body;
        toggle.addEventListener('change', () => {
            body.classList.toggle('light-mode');
            body.classList.toggle('dark-mode');
        });
    </script>
</body>
</html>
